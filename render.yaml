# Blueprint do Render (https://render.com).
# Ao criar o Blueprint, deixe o campo "Blueprint Path" VAZIO — este arquivo já
# está na raiz do repositório, que é onde o Render procura por padrão.
# O plano free "dorme" após ~15 min sem acesso (cold start de ~50 s).
services:
  - type: web
    name: atletica-crm
    runtime: python
    plan: free
    branch: main
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true          # o Render gera uma chave forte sozinho
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        sync: false                  # você cola a string do Supabase no painel
      - key: PYTHON_VERSION
        value: "3.12.6"
