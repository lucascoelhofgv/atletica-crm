{% extends "base.html" %}
{% block titulo %}Meus dados{% endblock %}
{% block conteudo %}
<div class="page-head"><h1>Meus dados</h1></div>
<div class="painel" style="max-width:560px">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "partials/_campos.html" %}
    <div class="mt-3">
      <button class="btn btn-primary">Salvar</button>
      <a href="{% url 'contas:senha_alterar' %}" class="btn btn-light">Alterar senha</a>
    </div>
  </form>
</div>
{% endblock %}
