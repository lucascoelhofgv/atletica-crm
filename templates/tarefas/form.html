{% extends "base.html" %}
{% block titulo %}{% if object %}Editar tarefa{% else %}Nova tarefa{% endif %}{% endblock %}
{% block conteudo %}
<div class="page-head"><h1>{% if object %}Editar tarefa{% else %}Nova tarefa{% endif %}</h1></div>
<div class="painel">
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {% include "partials/_campos.html" %}
    <div class="mt-3">
      <button class="btn btn-primary">Salvar</button>
      <a href="{% url 'tarefas:lista' %}" class="btn btn-light">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
